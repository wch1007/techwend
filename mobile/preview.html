<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>汤问致新 · 手机端预览</title>
 <style>
 *{box-sizing:border-box}body{margin:0;background:#f3f2f0;color:#22222a;font-family:system-ui,"Microsoft YaHei",sans-serif}header{padding:32px 24px;text-align:center}h1{font-size:24px;margin:0 0 10px}h1 span{color:#f6314b}p{color:#76727b;font-size:14px}form{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin:24px 0 0}label{font-size:13px;color:#777;display:flex;align-items:center;gap:8px}select{padding:10px 14px;border:1px solid #ddd;border-radius:12px;background:#fff;color:#222;font:inherit;min-height:44px}.device{width:414px;max-width:100%;padding:12px;border-radius:42px;background:#202126;box-shadow:0 20px 70px #27232f24;margin:0 auto 50px}iframe{display:block;border:0;background:white;border-radius:30px;width:390px;max-width:100%;height:844px}footer{text-align:center;font-size:12px;color:#8a858c;padding:0 20px 30px}a{color:#bc2444}
 </style>
</head>
<body>
 <header><h1><span>汤问致新</span> · 手机端设计预览</h1><p>视频开场 / 动态光效 / 紧凑触控展台</p>
  <form><label>页面 <select id="page"><option value="index">首页</option><option value="products">产品介绍</option><option value="partnership">商务合作</option><option value="about">关于我们</option><option value="careers">加入我们</option><option value="contact">联系我们</option></select></label><label>屏幕宽度 <select id="width"><option>320</option><option selected>390</option><option>430</option></select></label></form>
 </header>
 <main class="device"><iframe src="../index.html" title="手机端网站预览" id="frame"></iframe></main>
 <footer>这里只是预览窗口，正式页面会根据屏幕宽度自动适配。<a href="../index.html" target="_blank">打开完整网站 ↗</a></footer>
 <script>
 const frame=document.getElementById('frame');
 document.getElementById('page').addEventListener('change',e=>frame.src='../'+e.target.value+'.html');
 document.getElementById('width').addEventListener('change',e=>{const w=Number(e.target.value);frame.style.width=w+'px';frame.parentElement.style.width=(w+24)+'px';});
 frame.addEventListener('load',()=>{try{const name=frame.contentWindow.location.pathname.split('/').pop().replace('.html','');if([...document.getElementById('page').options].some(o=>o.value===name))document.getElementById('page').value=name;}catch(e){}});
 </script>
</body>
</html>
